<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leaf Icons</title>
  <style>
    :root {
      --bg: #f6f3ee; --panel: #fffdf9; --text: #2b2724; --muted: #6f625a; --line: #e4ddd3;
      --stem-width: 6.4; --stem-color: #2d3550;
      --vein-width: 4.6; --vein-color: #2d3550; --vein-display: inline;
      --size: 96px;
    }
    :root[data-bg="dark"] { --bg: #1d1b19; --panel: #262320; --text: #f1e8dd; --muted: #a89b90; --line: #3a3530; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
    main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p { margin: 0 0 20px; color: var(--muted); }
    .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px 24px;
      background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 24px; }
    fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 8px; }
    legend { font-weight: 600; margin-bottom: 6px; }
    label { display: flex; align-items: center; gap: 8px; color: var(--muted); }
    label span { min-width: 52px; }
    input[type="range"] { flex: 1; min-width: 0; }
    output { font-variant-numeric: tabular-nums; min-width: 32px; text-align: right; color: var(--text); }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
    button { font: inherit; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); cursor: pointer; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(calc(var(--size) + 32px), 1fr)); gap: 12px; }
    figure { margin: 0; padding: 16px 8px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; text-align: center; }
    figure svg { width: var(--size); height: var(--size); display: block; margin: 0 auto 8px; }
    figcaption { font-size: 12px; color: var(--muted); }
    .stem, .vein, .needle { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .stem { stroke: var(--stem-color); stroke-width: calc(var(--stem-width) * var(--k, 1) * 1px); }
    .stem-fill { fill: var(--stem-color); }
    .vein { stroke: var(--vein-color); stroke-width: calc(var(--vein-width) * var(--k, 1) * 1px); display: var(--vein-display); }
    pre { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; overflow-x: auto; margin: 24px 0 0; }
  </style>
</head>
<body>
  <main>
    <h1>Leaf icons</h1>
    <p>Adjust the stems and veins, then copy the settings into <code>stems.config.json</code> and run <code>npm run build</code>.</p>

    <div class="controls">
      <fieldset>
        <legend>Stems</legend>
        <label><span>Width</span><input id="stem-width" type="range" min="1" max="12" step="0.1"><output for="stem-width"></output></label>
        <label><span>Color</span><input id="stem-color" type="color"></label>
      </fieldset>
      <fieldset>
        <legend>Veins</legend>
        <label><input id="veins-show" type="checkbox"> Show veins</label>
        <label><span>Width</span><input id="vein-width" type="range" min="0.5" max="10" step="0.1"><output for="vein-width"></output></label>
        <label><span>Color</span><input id="vein-color" type="color"> <label><input id="vein-match" type="checkbox"> Same as stem</label></label>
      </fieldset>
      <fieldset>
        <legend>View</legend>
        <label><span>Size</span><input id="size" type="range" min="16" max="160" step="4" value="96"><output for="size"></output></label>
        <label><input id="dark" type="checkbox"> Dark background</label>
        <div class="actions"><button id="copy" type="button">Copy settings</button><button id="reset" type="button">Reset</button></div>
      </fieldset>
    </div>

    <div class="grid">
      <!-- ICONS -->
    </div>

    <pre id="json"></pre>
  </main>
  <script>
    const initial = /* CONFIG */ null
    const $ = (id) => document.getElementById(id)
    const rootStyle = document.documentElement.style
    let config

    function render() {
      rootStyle.setProperty('--stem-width', config.stem.width)
      rootStyle.setProperty('--stem-color', config.stem.color)
      rootStyle.setProperty('--vein-width', config.veins.width)
      rootStyle.setProperty('--vein-color', config.veins.color)
      rootStyle.setProperty('--vein-display', config.veins.show ? 'inline' : 'none')
      $('stem-width').value = config.stem.width
      $('stem-color').value = config.stem.color
      $('veins-show').checked = config.veins.show
      $('vein-width').value = config.veins.width
      $('vein-color').value = config.veins.color
      $('vein-color').disabled = $('vein-match').checked
      for (const o of document.querySelectorAll('output')) o.value = $(o.htmlFor).value
      $('json').textContent = JSON.stringify(config, null, 2)
    }

    function load() {
      config = structuredClone(initial)
      $('vein-match').checked = config.veins.color === config.stem.color
      render()
    }

    $('stem-width').oninput = (e) => { config.stem.width = +e.target.value; render() }
    $('stem-color').oninput = (e) => {
      config.stem.color = e.target.value
      if ($('vein-match').checked) config.veins.color = e.target.value
      render()
    }
    $('veins-show').onchange = (e) => { config.veins.show = e.target.checked; render() }
    $('vein-width').oninput = (e) => { config.veins.width = +e.target.value; render() }
    $('vein-color').oninput = (e) => { config.veins.color = e.target.value; render() }
    $('vein-match').onchange = (e) => { if (e.target.checked) config.veins.color = config.stem.color; render() }
    $('size').oninput = (e) => { rootStyle.setProperty('--size', e.target.value + 'px'); $('size').nextElementSibling.value = e.target.value }
    $('dark').onchange = (e) => { document.documentElement.dataset.bg = e.target.checked ? 'dark' : '' }
    $('reset').onclick = load
    $('copy').onclick = async () => {
      const text = JSON.stringify(config, null, 2) + '\n'
      try { await navigator.clipboard.writeText(text); $('copy').textContent = 'Copied' }
      catch { $('copy').textContent = 'Copy failed: use the text below' }
      setTimeout(() => ($('copy').textContent = 'Copy settings'), 1500)
    }

    $('size').nextElementSibling.value = $('size').value
    load()
  </script>
</body>
</html>
